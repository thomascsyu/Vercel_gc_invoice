openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard operations
  - name: clients
    description: Client operations
  - name: invoices
    description: Invoice operations
  - name: quotations
    description: Quotation operations
  - name: proposals
    description: ISO consulting proposal operations
  - name: payments
    description: Payment operations
  - name: payment-receipts
    description: Payment receipt and attachment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Recent business activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: active
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: sortBy
          description: When set, results are ordered by this column.
          schema:
            $ref: "#/components/schemas/ClientListSortBy"
        - in: query
          name: sortDir
          schema:
            $ref: "#/components/schemas/SortDirection"
      responses:
        "200":
          description: Client list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClients"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/export:
    get:
      operationId: exportClients
      tags: [clients]
      summary: Export clients as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
  /clients/import:
    post:
      operationId: importClients
      tags: [clients]
      summary: Validate and preview a clients CSV upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPatch"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /clients/{id}/proposal:
    get:
      operationId: getClientProposal
      tags: [clients]
      summary: Get a client's proposal view (confirmed quotation + manual proposal)
      description: >-
        Returns the client's most recent confirmed (system-generated) quotation,
        if any, plus any manually-entered proposal details for clients without a
        system-generated proposal.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client proposal view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProposalView"
    put:
      operationId: upsertClientProposal
      tags: [clients]
      summary: Create or update a client's manual proposal details
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProposalInput"
      responses:
        "200":
          description: Saved client proposal view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProposalView"
  /clients/{id}/proposal/migrate:
    post:
      operationId: migrateClientProposal
      tags: [clients]
      summary: Migrate legacy client proposal tracker into a draft proposal document
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: Migrated proposal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProposalMigrateResult"
        "200":
          description: Proposal document already exists for this legacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProposalMigrateResult"
  /clients/{id}/certifications:
    get:
      operationId: getClientCertifications
      tags: [clients]
      summary: List a client's certifications and audit history
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client certifications with audit rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationsView"
    post:
      operationId: createClientCertification
      tags: [clients]
      summary: Add a certification (CB + standard) for a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCertificationInput"
      responses:
        "201":
          description: Created certification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationWithAudits"
    put:
      operationId: replaceClientCertifications
      tags: [clients]
      summary: Replace all certifications and audits for a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceClientCertificationsBody"
      responses:
        "200":
          description: Saved certifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationsView"
  /clients/{id}/certifications/{certId}:
    patch:
      operationId: updateClientCertification
      tags: [clients]
      summary: Update certification body or standard
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CertIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCertificationPatch"
      responses:
        "200":
          description: Updated certification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationWithAudits"
    delete:
      operationId: deleteClientCertification
      tags: [clients]
      summary: Delete a certification and its audit history
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CertIdParam"
      responses:
        "204":
          description: Deleted
  /clients/{id}/certifications/{certId}/audits:
    post:
      operationId: createClientCertificationAudit
      tags: [clients]
      summary: Add an audit date to a certification
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CertIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCertificationAuditInput"
      responses:
        "201":
          description: Created audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationAudit"
  /clients/{id}/certifications/{certId}/audits/{auditId}:
    patch:
      operationId: updateClientCertificationAudit
      tags: [clients]
      summary: Update an audit record
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CertIdParam"
        - $ref: "#/components/parameters/AuditIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCertificationAuditPatch"
      responses:
        "200":
          description: Updated audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCertificationAudit"
    delete:
      operationId: deleteClientCertificationAudit
      tags: [clients]
      summary: Delete an audit record
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CertIdParam"
        - $ref: "#/components/parameters/AuditIdParam"
      responses:
        "204":
          description: Deleted
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - in: query
          name: clientId
          schema:
            type: string
        - in: query
          name: q
          description: Search by invoice number, client name, client code, or amount (partial match).
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvoices"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/export:
    get:
      operationId: exportInvoices
      tags: [invoices]
      summary: Export invoices as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
  /invoices/continuity:
    get:
      operationId: getInvoiceContinuity
      tags: [invoices]
      summary: Verify invoice number continuity
      description: >
        Returns the last invoice number for each month, missing global sequence slots,
        voided (soft-deleted) invoices, reissued numbers, and duplicate collisions.
        Permanently purged invoices are not included and may appear as sequence gaps.
        Custom imported numbers are listed as unparsed and excluded from gap detection.
      responses:
        "200":
          description: Invoice continuity report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceContinuityReport"
  /invoices/import:
    post:
      operationId: importInvoices
      tags: [invoices]
      summary: Validate and preview an invoices CSV upload
      description: >
        Columns: Invoice Number, Client name, Invoice Amount, Invoice Date, item1, item2. Currency always defaults to HKD.
        Match client by clientId (UUID), clientCode, email (column clientEmail), or client name (Client name / clientName / name).
        Invalid rows are skipped on commit; preview lists errors per row.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePatch"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /invoices/{id}/share-token:
    post:
      operationId: generateInvoiceShareToken
      tags: [invoices]
      summary: Generate or renew a share token for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Generated share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTokenResponse"
    delete:
      operationId: revokeInvoiceShareToken
      tags: [invoices]
      summary: Revoke the share token for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Revoked
  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: List quotations
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuotationStatus"
        - in: query
          name: clientId
          schema:
            type: string
        - in: query
          name: validityStatus
          description: Filter by whether the quotation's valid-until date is before (expired) or on/after (active) today.
          schema:
            $ref: "#/components/schemas/QuotationValidityFilter"
        - in: query
          name: sortBy
          description: When set, results are ordered by this column; expired actionable rows are still listed before others as a secondary sort.
          schema:
            $ref: "#/components/schemas/QuotationListSortBy"
        - in: query
          name: sortDir
          schema:
            $ref: "#/components/schemas/SortDirection"
        - in: query
          name: q
          description: "Prefix-based search: Q + digits for quotation number (partial match), $… total amount (commas/decimals normalized), or plain text for client name/code."
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Quotation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedQuotations"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Create quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationInput"
      responses:
        "201":
          description: Created quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
  /quotations/export:
    get:
      operationId: exportQuotations
      tags: [quotations]
      summary: Export quotations as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
  /quotations/import:
    post:
      operationId: importQuotations
      tags: [quotations]
      summary: Validate and preview a quotations CSV upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: Get quotation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: Update quotation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationPatch"
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete quotation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /quotations/{id}/convert:
    post:
      operationId: convertQuotation
      tags: [quotations]
      summary: Convert a confirmed quotation to an invoice
      description: >
        Only confirmed quotations can be converted. The request body is optional;
        omitted fields are copied from the quotation (invoice starts as draft).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertQuotationInput"
      responses:
        "201":
          description: Created invoice from quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "422":
          description: Quotation is not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /quotations/{id}/share-token:
    post:
      operationId: generateShareToken
      tags: [quotations]
      summary: Generate or renew a share token for a quotation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Generated share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTokenResponse"
    delete:
      operationId: revokeShareToken
      tags: [quotations]
      summary: Revoke the share token for a quotation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Revoked
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - in: query
          name: invoiceId
          schema:
            type: string
          description: Filter by invoice ID
        - in: query
          name: clientId
          schema:
            type: string
          description: Filter by client ID
        - in: query
          name: invoiceNumber
          schema:
            type: string
          description: Search by invoice number (partial match)
        - in: query
          name: q
          schema:
            type: string
          description: Search by cheque number, reference number, or transaction ID
        - in: query
          name: paymentMethod
          schema:
            type: string
          description: Filter by payment method
        - in: query
          name: dateFrom
          schema:
            type: string
          description: Filter by payment date from (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
          description: Filter by payment date to (YYYY-MM-DD)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPayments"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/export:
    get:
      operationId: exportPayments
      tags: [payments]
      summary: Export payments as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
  /payments/import:
    post:
      operationId: importPayments
      tags: [payments]
      summary: Validate and preview a payments CSV upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
  /payments/{id}:
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete payment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /payments/{id}/receipt:
    post:
      operationId: generateReceiptFromPayment
      tags: [payments]
      summary: Generate a formal receipt pre-filled from this payment (amount, currency, date, invoice, client)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "409":
          description: This payment already has a linked receipt
  /payments/{id}/receipts:
    get:
      operationId: listPaymentReceipts
      tags: [payments]
      summary: List payment receipts and attachments
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of payment receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentReceipt"
    post:
      operationId: uploadPaymentReceipt
      tags: [payments]
      summary: Upload a payment receipt, screenshot, or cheque deposit record
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The receipt file to upload (image or PDF)
                receiptType:
                  type: string
                  enum: [receipt, screenshot, cheque_deposit, other]
                  description: Type of receipt being uploaded
                description:
                  type: string
                  description: Optional description of the receipt
              required: [file, receiptType]
      responses:
        "201":
          description: Uploaded receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceipt"
  /payments/{paymentId}/receipts/{receiptId}:
    get:
      operationId: getPaymentReceipt
      tags: [payments]
      summary: Get payment receipt details
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceipt"
    delete:
      operationId: deletePaymentReceipt
      tags: [payments]
      summary: Delete a payment receipt
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /payments/{paymentId}/receipts/{receiptId}/download:
    get:
      operationId: downloadPaymentReceipt
      tags: [payments]
      summary: Download a payment receipt file
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
        - name: receiptId
          in: path
          required: true
          schema:
