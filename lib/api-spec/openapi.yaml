components:
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
    CertIdParam:
      in: path
      name: certId
      required: true
      schema:
        type: string
    AuditIdParam:
      in: path
      name: auditId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Currency:
      type: string
      enum: [HKD, USD, CNY, MOP]
    ServiceCategory:
      type: string
      description: Document service classification for reporting and analysis.
      enum: [setup, main, pen, vscan, others]
    InvoiceStatus:
      type: string
      enum: [draft, pending_approval, approved, sent, revised, paid]
    QuotationStatus:
      type: string
      enum:
        [
          draft,
          pending_approval,
          sent,
          skip,
          approved,
          canceled,
          confirmed,
          invoiced,
        ]
    QuotationValidityFilter:
      type: string
      enum: [active, expired]
    QuotationListSortBy:
      type: string
      enum:
        [quotationNumber, quotationDate, validUntil, total, status, createdAt]
    ClientListSortBy:
      type: string
      enum: [name, clientCode, email, createdAt, isActive]
    SortDirection:
      type: string
      enum: [asc, desc]
    Client:
      type: object
      properties:
        id:
          type: string
        clientCode:
          type: string
        name:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        country:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/ClientCertification"
      required: [id, clientCode, name, email, isActive, createdAt]
    AuditVisitStatus:
      type: string
      enum: [sv, rn, sv_rn]
    ClientCertificationLatestAudit:
      type: object
      required: [auditDate]
      properties:
        auditDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/AuditVisitStatus"
    ClientCertification:
      type: object
      required: [id, certificationBody, standard]
      properties:
        id:
          type: string
        certificationBody:
          type: string
        standard:
          type: string
        latestAudit:
          $ref: "#/components/schemas/ClientCertificationLatestAudit"
    ClientCertificationAudit:
      type: object
      required: [id, certificationId, auditDate]
      properties:
        id:
          type: string
        certificationId:
          type: string
        auditDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/AuditVisitStatus"
        notes:
          type: string
    ClientCertificationWithAudits:
      type: object
      required: [id, certificationBody, standard, audits]
      properties:
        id:
          type: string
        certificationBody:
          type: string
        standard:
          type: string
        audits:
          type: array
          items:
            $ref: "#/components/schemas/ClientCertificationAudit"
    ClientCertificationsView:
      type: object
      required: [clientId, certifications]
