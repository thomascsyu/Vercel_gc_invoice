name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow sharp native build
        run: pnpm approve-builds sharp || true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Frontend tests
        run: pnpm --filter @workspace/invoiceplane run test

      - name: API unit tests
        run: pnpm --filter @workspace/api-server exec tsx --test 'src/**/*.test.ts'

      - name: OpenAPI codegen check
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code lib/api-client-react lib/api-zod
