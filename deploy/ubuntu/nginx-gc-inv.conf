# Install:
#   sudo cp deploy/ubuntu/nginx-gc-inv.conf /etc/nginx/sites-available/gc-inv
#   sudo ln -s /etc/nginx/sites-available/gc-inv /etc/nginx/sites-enabled/gc-inv
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS on this Simple Application Server (Let's Encrypt):
#   sudo certbot --nginx -d gcinvoice.cc
# TRUST_PROXY_HOPS=1
# Also allow TCP 80 and 443 on the server Firewall page.
#
# Optional later proxy in front of nginx:
#   set X-Forwarded-Proto to $http_x_forwarded_proto and TRUST_PROXY_HOPS=2
#   so the client IP is not recorded as that proxy.

server {
    listen 80;
    listen [::]:80;
    server_name gcinvoice.cc;

    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
